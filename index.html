<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tankbuch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h1>⛽ Tankbuch</h1>
    <p class="login-sub">Bitte anmelden</p>
    <form id="loginForm">
      <label>E-Mail
        <input id="loginEmail" type="email" autocomplete="email" required>
      </label>
      <label>Passwort
        <input id="loginPass" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" id="loginBtn">Anmelden</button>
      <div id="loginError" class="login-error"></div>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appScreen" style="display:none">
  <div class="app-header">
    <h1>Tankbuch</h1>
    <button id="logoutBtn" class="logout-btn">Abmelden</button>
  </div>

  <!-- Fahrzeuge (nur Auswahl, kein Anlegen mehr) -->
  <section id="vehicleSection">
    <div id="vehicleTabs"></div>
  </section>

  <!-- Tankbeleg -->
  <section id="formSection">
    <h2>Neuer Tankbeleg</h2>
    <form id="entryForm">
      <label>Datum
        <input id="fDatum" type="date" required>
      </label>
      <label>km-Stand
        <input id="fKm" type="number" min="0" step="1" required>
      </label>
      <label>Liter (Menge)
        <input id="fMenge" type="number" min="0" step="0.01" required>
      </label>
      <label>€ / Liter
        <input id="fPreis" type="number" min="0" step="0.001" required>
      </label>
      <label>Reifen (Radgröße)
        <select id="fRadae">
          <option>Sommer</option>
          <option>Winter</option>
          <option>Allwetter</option>
        </select>
      </label>
      <label>Tankart
        <select id="fVoll">
          <option value="true">Volltankung</option>
          <option value="false">Teiltankung</option>
        </select>
      </label>
      <label>Bemerkung
        <input id="fBemerkung" type="text" placeholder="optional">
      </label>
      <button type="submit">Speichern</button>
    </form>
    <div id="status" aria-live="polite"></div>
  </section>

  <!-- Tabelle -->
  <section id="tableSection">
    <div id="avgConsumption"></div>
    <table>
      <thead>
        <tr>
          <th>Datum</th><th>km</th><th>Liter</th><th>€/l</th>
          <th>Reifen</th><th>Voll</th><th>l/100 km</th><th>€/100 km</th><th></th>
        </tr>
      </thead>
      <tbody id="entriesBody"></tbody>
    </table>
    <div id="emptyState">Kein Fahrzeug ausgewählt.</div>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
