<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>⛽ Tankbuch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-card">
      <h1>⛽ Tankbuch</h1>
      <p class="login-sub">Bitte anmelden</p>
      <form id="loginForm">
        <label>E-Mail
          <input type="email" id="loginEmail" autocomplete="email" required />
        </label>
        <label>Passwort
          <input type="password" id="loginPass" autocomplete="current-password" required />
        </label>
        <div class="login-error" id="loginError"></div>
        <button type="submit" id="loginBtn">Anmelden</button>
      </form>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="appScreen" style="display:none">

    <header class="app-header">
      <h1>Tankbuch</h1>
      <div class="header-actions">
        <button class="theme-btn" id="themeToggle" title="Design wechseln">🌙</button>
        <button class="logout-btn" id="logoutBtn">Abmelden</button>
      </div>
    </header>

    <!-- FAHRZEUGE: nur die Auswahl der Autos, kein Anlegen/Bearbeiten -->
    <section class="vehicles-section">
      <h2>Fahrzeuge</h2>
      <div class="vehicle-tabs" id="vehicleTabs"></div>
    </section>

    <!-- BELEGE -->
    <section class="entries-section">
      <div class="section-header">
        <h2 style="margin:0">Tankbelege</h2>
        <button class="fab-btn" id="openEntrySheet">+ Beleg</button>
      </div>

      <div class="status-bar" id="status"></div>

      <div class="empty-state" id="emptyState" style="display:none">Kein Fahrzeug ausgewählt.</div>

      <div class="entries-list" id="entriesList"></div>

      <p class="avg-consumption" id="avgConsumption"></p>
    </section>

  </div>

  <!-- ================= BOTTOM SHEET (Popup) ================= -->
  <div class="sheet-overlay" id="entrySheetOverlay" style="display:none">
    <div class="bottom-sheet" id="entrySheet">
      <div class="sheet-grabber"></div>
      <button class="sheet-close" id="sheetClose" title="Schließen">✕</button>
      <h3>Neuer Tankbeleg</h3>
      <form class="sheet-form" id="entryForm">
        <label>Datum
          <input type="date" id="fDatum" required />
        </label>
        <label>km-Stand
          <input type="number" id="fKm" placeholder="z. B. 45200" inputmode="numeric" required />
        </label>
        <label>Liter (Menge)
          <input type="number" id="fMenge" placeholder="z. B. 48,5" step="0.1" inputmode="decimal" required />
        </label>
        <label>€ / Liter
          <input type="number" id="fPreis" placeholder="z. B. 1,79" step="0.01" inputmode="decimal" required />
        </label>
        <label>Reifen (Radgröße)
          <select id="fRadae">
            <option value="Sommer">Sommer</option>
            <option value="Winter">Winter</option>
            <option value="Allwetter">Allwetter</option>
          </select>
        </label>
        <label>Tankart
          <select id="fVoll">
            <option value="true">Volltankung</option>
            <option value="false">Teiltankung</option>
          </select>
        </label>
        <label>Bemerkung
          <input type="text" id="fBemerkung" placeholder="Optional" />
        </label>
        <button type="submit" class="sheet-submit">Speichern</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
