<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>⛽ Tankbuch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-card">
      <h1>⛽ Tankbuch</h1>
      <p class="login-sub">Bitte anmelden</p>
      <form id="loginForm">
        <label>E-Mail
          <input type="email" id="loginEmail" autocomplete="username" required />
        </label>
        <label>Passwort
          <input type="password" id="loginPass" autocomplete="current-password" required />
        </label>
        <div class="login-error" id="loginError"></div>
        <button type="submit" id="loginBtn">Anmelden</button>
      </form>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="appScreen" style="display:none">
    <header class="app-header">
      <h1>Tankbuch</h1>
      <div class="header-actions">
        <button class="theme-btn" id="themeToggle" title="Design umschalten">🌙</button>
        <button class="logout-btn" id="logoutBtn" title="Abmelden" aria-label="Abmelden">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"/>
            <path d="M16 8l4 4-4 4"/>
            <path d="M20 12H9"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Fahrzeuge -->
    <section class="vehicles-section">
      <h2>Fahrzeuge</h2>
      <div class="vehicle-tabs" id="vehicleTabs"></div>
    </section>

    <!-- Tankbelege -->
    <section class="entries-section">
      <div class="section-header">
        <h2 class="section-title-inline">Tankbelege</h2>
        <button class="fab-btn" id="openEntrySheet" title="Neuer Beleg" aria-label="Neuer Beleg">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="status-bar" id="status"></div>
      <div class="entries-table-wrap" id="entriesList"></div>
      <div class="empty-state" id="emptyState">Kein Fahrzeug ausgewählt.</div>
    </section>
  </div>

  <!-- ================= BOTTOM SHEET (Neuer Tankbeleg) ================= -->
  <div class="sheet-overlay" id="entrySheetOverlay" style="display:none">
    <div class="bottom-sheet" id="entrySheet">
      <div class="sheet-grabber"></div>
      <button class="sheet-close" id="sheetClose" type="button">✕</button>
      <h3>Neuer Tankbeleg</h3>

      <form class="sheet-form" id="entryForm">
        <!-- 1 Spalte -->
        <label class="full">Datum
          <input type="date" id="fDatum" />
        </label>

        <label class="full">km-Stand
          <input type="number" inputmode="numeric" id="fKm" />
        </label>

        <!-- 2 Spalten: Menge | €/Liter (Kommazahl erlaubt) -->
        <label>Liter (Menge)
          <input type="text" inputmode="decimal" id="fMenge" />
        </label>
        <label>€ / Liter
          <input type="text" inputmode="decimal" id="fPreis" />
        </label>

        <!-- 2 Spalten: Reifen | Tankart -->
        <label>Reifen (Radgröße)
          <select id="fRadae">
            <option value="Sommer">Sommer</option>
            <option value="Winter">Winter</option>
            <option value="Allwetter">Allwetter</option>
          </select>
        </label>
        <label>Tankart
          <select id="fVoll">
            <option value="true">Volltankung</option>
            <option value="false">Teiltankung</option>
          </select>
        </label>

        <!-- 1 Spalte -->
        <label class="full">Bemerkung
          <input type="text" id="fBemerkung" placeholder="optional" />
        </label>

        <button type="submit" class="sheet-submit">Speichern</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
