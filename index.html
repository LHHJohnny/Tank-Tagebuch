<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>⛽ Tankbuch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="loginScreen" class="login-wrap" style="display:none;">
    <div class="login-card">
      <h1>⛽ Tankbuch</h1>
      <p class="login-sub">Bitte anmelden</p>
      <form id="loginForm">
        <label>E-Mail
          <input type="email" id="loginEmail" required autocomplete="email">
        </label>
        <label>Passwort
          <input type="password" id="loginPass" required autocomplete="current-password">
        </label>
        <div id="loginError" class="login-error"></div>
        <button type="submit" id="loginBtn">Anmelden</button>
      </form>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="appScreen" style="display:none;">

    <!-- HEADER -->
    <header class="app-header">
      <div class="header-title-wrap">
        <h1 id="appTitle">⛽ Tankbuch</h1>
        <div id="viewDropdown" class="view-dropdown">
          <button id="viewDropdownBtn" class="view-dropdown-btn" type="button" title="Ansicht wechseln">▾</button>
          <div id="viewDropdownList" class="view-dropdown-list">
            <button class="view-dropdown-item active" data-view="tank" type="button">⛽ Tankbuch</button>
            <button class="view-dropdown-item" data-view="service" type="button">🔧 ServiceBuch</button>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="theme-btn" type="button" title="Theme wechseln">🌙</button>
        <button id="logoutBtn" class="logout-btn" type="button" title="Abmelden">⎋</button>
      </div>
    </header>

    <!-- FAHRZEUGE (gemeinsam) -->
    <section class="vehicles-section">
      <h2>Fahrzeuge</h2>
      <div id="vehicleTabs" class="vehicle-tabs"></div>
    </section>

    <!-- TANKBUCH -->
    <section id="tankSection" class="entries-section">
      <div class="section-header">
        <h2 class="section-title-inline">Tankbelege</h2>
        <button id="openEntrySheet" class="fab-btn" type="button" title="Neuer Tankbeleg">+</button>
      </div>
      <div id="status" class="status-bar"></div>
      <div id="entriesList" class="entries-table-wrap"></div>
      <div id="emptyState" class="empty-state" style="display:none;">Kein Fahrzeug ausgewählt.</div>
    </section>

    <!-- SERVICEBUCH -->
    <section id="serviceSection" class="entries-section" style="display:none;">

      <!-- Übersicht -->
      <div class="service-overview">
        <div class="service-card">
          <div class="service-card-icon">🛡</div>
          <div class="service-card-content">
            <div class="service-card-title">TÜV</div>
            <div class="service-card-row">Letzter: <span id="tuvLast">–</span></div>
            <div class="service-card-row">Nächster: <span id="tuvNext">–</span></div>
          </div>
        </div>
        <div class="service-card">
          <div class="service-card-icon">🛢</div>
          <div class="service-card-content">
            <div class="service-card-title">Ölwechsel</div>
            <div class="service-card-row">Letzter: <span id="oilLast">–</span></div>
            <div class="service-card-row">Nächster: <span id="oilNext">–</span></div>
          </div>
        </div>
        <div class="service-card">
          <div class="service-card-icon">📝</div>
          <div class="service-card-content">
            <div class="service-card-title">Bemerkung</div>
            <textarea id="bemerkungField" class="bemerkung-textarea"
                      placeholder="Sonstiges hinterlegen …"></textarea>
          </div>
        </div>
      </div>

      <!-- Tabelle -->
      <div class="section-header">
        <h2 class="section-title-inline">Serviceeinträge</h2>
        <button id="openServiceSheet" class="fab-btn" type="button" title="Neuer Serviceeintrag">+</button>
      </div>
      <div id="serviceStatus" class="status-bar"></div>
      <div id="serviceList" class="entries-table-wrap"></div>
      <div id="serviceEmpty" class="empty-state" style="display:none;">Noch keine Einträge für dieses Fahrzeug.</div>

    </section>

  </div>

  <!-- ================= TANKBUCH BOTTOM SHEET ================= -->
  <div id="entrySheetOverlay" class="sheet-overlay" style="display:none;">
    <div id="entrySheet" class="bottom-sheet">
      <button id="sheetClose" class="sheet-close" type="button">✕</button>
      <div class="sheet-grabber"></div>
      <h3>Neuer Tankbeleg</h3>
      <form id="entryForm" class="sheet-form">
        <label class="full">Datum
          <input type="date" id="fDatum" required>
        </label>
        <label>km-Stand
          <input type="number" id="fKm" placeholder="z. B. 85000" step="1" required>
        </label>
        <label>Liter (Menge)
          <input type="text" id="fMenge" placeholder="z. B. 52,5" inputmode="decimal" required>
        </label>
        <label>€ / Liter
          <input type="text" id="fPreis" placeholder="z. B. 1,79" inputmode="decimal" required>
        </label>
        <label>Reifen (Radgröße)
          <select id="fRadae">
            <option value="Sommer">Sommer</option>
            <option value="Winter">Winter</option>
            <option value="Allwetter">Allwetter</option>
          </select>
        </label>
        <label>Tankart
          <select id="fVoll">
            <option value="true">Volltankung</option>
            <option value="false">Teiltankung</option>
          </select>
        </label>
        <label class="full">Bemerkung
          <input type="text" id="fBemerkung" placeholder="Optional">
        </label>
        <button type="submit" class="sheet-submit">Speichern</button>
      </form>
    </div>
  </div>

  <!-- ================= SERVICEBUCH BOTTOM SHEET ================= -->
  <div id="serviceSheetOverlay" class="sheet-overlay" style="display:none;">
    <div id="serviceSheet" class="bottom-sheet">
      <button id="serviceSheetClose" class="sheet-close" type="button">✕</button>
      <div class="sheet-grabber"></div>
      <h3>Neuer Serviceeintrag</h3>
      <form id="serviceForm" class="sheet-form">
        <label>Datum
          <input type="date" id="sDatum" required>
        </label>
        <label>Zieldatum
          <input type="date" id="sZieldatum">
        </label>
        <label>km-Stand
          <input type="number" id="sKm" placeholder="z. B. 85000" step="1" required>
        </label>
        <label>Ziel-km
          <input type="number" id="sZielKm" placeholder="z. B. 90000" step="1">
        </label>
        <label class="full">Kategorie
          <input type="text" id="sKategorie" list="kategorieList"
                 placeholder="z. B. TÜV, Öl, Reifen …" required>
          <datalist id="kategorieList">
            <option value="Reifen"></option>
            <option value="Motor"></option>
            <option value="Öl"></option>
            <option value="TÜV"></option>
            <option value="Bremse"></option>
          </datalist>
        </label>
        <label class="full">Bemerkung
          <textarea id="sBemerkung" rows="4"
                    placeholder="z. B. Knarzgeräusch an der Vorderachse …"></textarea>
        </label>
        <button type="submit" class="sheet-submit">Speichern</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
